[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secaware"
version = "1.0.0"
description = "Compact reproducible artifact for randomized security-intervention studies."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
secaware = "secaware.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m reviewer"
markers = [
  "reviewer: fast reviewer-facing scientific invariant suite",
  "milestone: minimal end-to-end reproduction checks",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
