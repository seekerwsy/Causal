[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secaware"
version = "0.2.0"
description = "TSG-driven prompt-side security mechanism discovery and confirmation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "causal-learn==0.1.4.7",
  "pydantic>=2.5,<3",
  "typer>=0.9",
  "pandas>=2",
  "numpy>=1.24",
  "networkx>=3",
  "pyyaml>=6",
  "rich>=13",
]

[project.scripts]
secaware = "secaware.cli:app"
secaware-oracle = "secaware.oracle.cli:app"

[project.optional-dependencies]
api = ["openai>=1.55.3,<3"]
dev = [
  "pip==25.0.1",
  "pytest>=8",
  "setuptools==83.0.0",
  "wheel==0.47.0",
]
oracle = [
  "semgrep==1.168.0",
  "bandit==1.9.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"secaware.extractors" = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "oracle_tools: requires the exact locked Semgrep and Bandit executables",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
