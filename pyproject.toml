[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secaware"
version = "0.1.0"
description = "TSG-driven prompt-side security mechanism discovery and confirmation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5,<3",
  "typer>=0.9",
  "pandas>=2",
  "numpy>=1.24",
  "networkx>=3",
  "pyyaml>=6",
  "rich>=13",
]

[project.scripts]
secaware = "secaware.cli:app"
secaware-oracle = "secaware.oracle.cli:app"

[project.optional-dependencies]
api = ["openai>=1.40,<3"]
dev = [
  "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
