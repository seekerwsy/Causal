[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-mechanism-study"
version = "1.6.0"
description = "Auditable task-unit experiments for frozen prompt-mechanism policies."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
prompt-mechanism-study = "prompt_mechanism_study.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
selectors = ["causal-learn==0.1.4.7", "numpy>=2,<3"]
languages = [
  "tree-sitter==0.25.2",
  "tree-sitter-c==0.24.1",
  "tree-sitter-cpp==0.23.4",
  "tree-sitter-c-sharp==0.23.1",
  "tree-sitter-go==0.25.0",
  "tree-sitter-java==0.23.5",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-php==0.24.1",
  "tree-sitter-rust==0.24.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prompt_mechanism_study = ["fixtures/*.json", "fixtures/*.html", "fixtures/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "milestone: minimal end-to-end reproduction checks",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
