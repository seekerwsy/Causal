run:
  name: paper_v0
  random_seed: 123
  output_dir: runs/paper_v0

data:
  prompts_path: data/examples/prompts_demo.jsonl
  prompt_attestations_path: data/examples/prompt_attestations_demo.jsonl
  functional_outcome_contracts_path: null
  task_functional_contracts_path: null

tsg:
  prompt_extractor: llm_facts_v1
  llm:
    provider: openai_compatible
    model_id: gpt-4.1-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 60.0
    max_attempts: 3
    max_response_bytes: 262144
    temperature: 0.0
    top_p: 1.0
    seed: 0

discovery:
  backend: causal_learn_fci_v1
  backend_version: 0.1.4.7
  ci_test: gsq
  alpha: 0.05
  depth: 3
  max_path_length: 6
  timeout_seconds: 120.0
  max_variables: 64
  max_rows: 100000
  bootstrap_samples: 1000
  stability_threshold: 0.8
  max_candidate_paths: 512
  min_independent_tasks: 20
  max_failed_bootstrap_fraction: 0.1

intervention:
  mode: text_native
  executor: llm
  llm:
    model_id: gpt-4.1-mini
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_seconds: 60.0
    max_attempts: 3
    max_response_bytes: 262144
    temperature: 0.0
    top_p: 1.0
    seed: 0
  operations:
    - add
    - remove
  max_protocols: 64
  max_protocol_instances: 256
  max_arm_executions: 2048

generation:
  provider: mock
  models:
    - mock-secaware-v0
  seeds:
    - 1
    - 2
  confirmation_seeds:
    - 101
    - 102
    - 103
    - 104
    - 105
    - 106
    - 107
    - 108
    - 109
    - 110
    - 111
    - 112

randomization:
  rng_version: sha256-rejection-fisher-yates-v1
  max_blocks: 10000
  min_independent_tasks_per_semantic_protocol: 20

# Used only by Oracle stages. Oracle execution additionally requires the runtime
# capabilities documented in README.md; unsupported runtimes fail closed.
oracle:
  language: python
  policy_lock_path: policies/oracle/python/policy.lock.json
  semgrep_executable: semgrep
  bandit_executable: bandit
  timeout_seconds: 120.0
  max_stdout_bytes: 67108864
  max_stderr_bytes: 4194304

# Frozen Ali Bailian functional evaluator. The credential is supplied only through
# ALI_BAILIAN_API_KEY and must never be written to configuration or artifacts.
functional_judge:
  # Coordinates are frozen here, but execution is enabled only in a derived experiment
  # config whose task contract bundle exactly covers its randomized assignments.
  enabled: false
  # One blind validated judgment is the primary functional analysis. A separately
  # versioned two-pass config is retained for sensitivity analysis only.
  mode: single_pass
  llm:
    provider: openai_compatible
    model_id: qwen3.5-flash-2026-02-23
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: ALI_BAILIAN_API_KEY
    timeout_seconds: 60.0
    max_attempts: 3
    max_response_bytes: 65536
    temperature: 0.0
    top_p: 1.0
    seed: null
    enable_thinking: false
  pass_seeds:
    - 73001

analysis:
  bootstrap_samples: 1000
  ci_level: 0.95
  min_eligible_pairs: 20
  min_flip_rate: 0.05
  max_side_effect_rate_confirmed: 0.10
