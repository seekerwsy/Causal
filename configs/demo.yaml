run:
  name: demo
  random_seed: 123
  output_dir: runs/demo

data:
  prompts_path: data/examples/prompts_demo.jsonl
  prompt_attestations_path: data/examples/prompt_attestations_demo.jsonl
  functional_outcome_contracts_path: null

tsg:
  prompt_extractor: deterministic_catalog_v1

discovery:
  backend: causal_learn_fci_v1
  backend_version: 0.1.4.7
  ci_test: gsq
  alpha: 0.05
  depth: 3
  max_path_length: 6
  timeout_seconds: 120.0
  max_variables: 64
  max_rows: 100000
  bootstrap_samples: 20
  stability_threshold: 0.8
  max_candidate_paths: 512
  min_independent_tasks: 2
  max_failed_bootstrap_fraction: 0.1

intervention:
  mode: text_native
  executor: deterministic
  llm: null
  operations:
    - add
    - remove
  max_protocols: 64
  max_protocol_instances: 256
  max_arm_executions: 2048

generation:
  provider: mock
  models:
    - mock-secaware-v0
  seeds:
    - 1
    - 2

# Used only by Oracle stages. Oracle execution additionally requires the runtime
# capabilities documented in README.md; unsupported runtimes fail closed.
oracle:
  language: python
  policy_lock_path: policies/oracle/python/policy.lock.json
  semgrep_executable: semgrep
  bandit_executable: bandit
  timeout_seconds: 120.0
  max_stdout_bytes: 67108864
  max_stderr_bytes: 4194304

analysis:
  bootstrap_samples: 200
  ci_level: 0.95
  min_eligible_pairs: 2
  min_flip_rate: 0.05
  max_side_effect_rate_confirmed: 0.10
