run:
  name: five_cwe_gate_b_bailian_v1
  random_seed: 20260818
  output_dir: runs/e2e-pilot/five-cwe-gate-b-bailian-v1

data:
  prompts_path: data/e2e-pilot/five-cwe-engineering-pilot-v3/prompts.jsonl
  prompt_attestations_path: data/e2e-pilot/five-cwe-engineering-pilot-v3/prompt-attestations.jsonl
  functional_outcome_contracts_path: null
  task_functional_contracts_path: data/e2e-pilot/five-cwe-engineering-pilot-v3/task-functional-contracts.jsonl

tsg:
  prompt_extractor: llm_facts_v1
  llm:
    provider: openai_compatible
    model_id: qwen3.5-flash-2026-02-23
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: ALI_BAILIAN_API_KEY
    timeout_seconds: 60.0
    max_attempts: 1
    max_response_bytes: 262144
    temperature: 0.0
    top_p: 1.0
    seed: 0
    enable_thinking: false

discovery:
  backend: causal_learn_fci_v1
  backend_version: 0.1.4.7
  ci_test: gsq
  alpha: 0.05
  depth: 3
  max_path_length: 6
  timeout_seconds: 120.0
  max_variables: 64
  max_rows: 100000
  bootstrap_samples: 20
  stability_threshold: 0.8
  max_candidate_paths: 64
  min_independent_tasks: 2
  max_failed_bootstrap_fraction: 0.1

intervention:
  mode: text_native
  executor: llm
  llm:
    model_id: qwen3.5-flash-2026-02-23
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: ALI_BAILIAN_API_KEY
    timeout_seconds: 60.0
    max_attempts: 1
    max_response_bytes: 262144
    temperature: 0.0
    top_p: 1.0
    seed: 0
    enable_thinking: false
  operations: [add]
  max_protocols: 5
  max_protocol_instances: 20
  max_arm_executions: 20

generation:
  provider: mock
  models: [mock-secaware-v0]
  seeds: [2026081802]
  confirmation_seeds: [2026081811]
  confirmation_max_requests: 20
  confirmation_max_attempts_per_request: 1
  confirmation_max_total_provider_attempts: 20
  confirmation_max_tokens_per_request: 1024
  confirmation_max_timeout_seconds_per_attempt: 60.0
  confirmation_max_worst_case_wait_seconds: 60.0

randomization:
  rng_version: sha256-rejection-fisher-yates-v1
  max_blocks: 5
  min_independent_tasks_per_semantic_protocol: 2

oracle:
  language: python
  policy_lock_path: policies/oracle/python-v2/policy.lock.json
  semgrep_executable: semgrep
  bandit_executable: bandit
  timeout_seconds: 120.0
  max_stdout_bytes: 67108864
  max_stderr_bytes: 4194304

functional_judge:
  enabled: false
  mode: single_pass
  llm:
    provider: openai_compatible
    model_id: qwen3.5-flash-2026-02-23
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: ALI_BAILIAN_API_KEY
    timeout_seconds: 60.0
    max_attempts: 1
    max_response_bytes: 65536
    temperature: 0.0
    top_p: 1.0
    seed: null
    enable_thinking: false
  pass_seeds: [73001]

analysis:
  bootstrap_samples: 200
  ci_level: 0.95
  min_independent_tasks: 2
  min_eligible_pairs: 2
  min_flip_rate: 0.05
  max_side_effect_rate_confirmed: 0.10
